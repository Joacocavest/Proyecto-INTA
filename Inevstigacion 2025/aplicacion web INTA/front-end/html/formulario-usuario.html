<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registrarse GreenWeb</title>
        <link rel="icon" href="/aplicacionDeTecnologiasIOT/static/img/GReenWebSinFondo.png" type="image/x-icon">

    <!-- CSS -->
    <link rel="stylesheet" href="/Inevstigacion 2025/aplicacion web INTA/front-end/static/css/base.css">
    <link rel="stylesheet" href="../static/css/usuario.css">
</head>
<body>
    
    <!-- Header -->
    <header>
        <div id="arribaheader">
            <div id="logo">
                <img src="../static/img/GReenWebSinFondo.png" alt="Logo GreenWeb">
            </div>

            <h1>GreenWeb</h1>


            <div id="user-info">
                <button>Perfil de usuario</button>
                <button>Nombre de usuario</button>
            </div>
        </div>        
        
        <nav>
            <a href="#">Administración</a>
            <a href="#">Home</a>
            <a href="#">Nodos sensores</a>
        </nav>
    </header>

    <!-- Contenido dinámico -->
    <main>
        <div id="registrarse">
            <div>
                <p>
                    “Del campo al dato con un solo código, utilizando trazabilidad inteligente para una gestión eficiente”
                </p>
            </div>

            <div>
                <h2>Registrarse</h2>
            </div>

            <form action="#" method="get">
                <div>
                    
                    <fieldset>
                        <label id="datosUsuario"><Strong>Datos de usuario</Strong></label> 
                        
                        <div id="inputs-registrarse">
                            <label for="usuario-nombre"></label> 
                                <input type="text" name="usuario-nombre" id="usuario-nombre" placeholder="👤 Nombre" maxlength="40" required> <br>

                            <label for="usuario-apellido"></label> 
                                <input type="text" name="usuario-apellido" id="usuario-apellido" placeholder="👤 Apellido" maxlength="40" required> <br>

                            <label for="usuario-cuit"></label> 
                                <input type="text" name="usuario-cuit" id="usuario-cuit" placeholder="🪪 Cuit: 12-12345678-1" pattern="^\d{2}-\d{8}-\d{1}$" required> <br>

                            <label for="usuario-telefono"></label> 
                                <input type="tel" name="usuario-telefono" id="usuario-telefono" placeholder="📱 Telefono: +0123456789" pattern="^\+?\d{10,15}$" required> <br>

                            <label for="usuario-email"></label> 
                                <input type="email" name="usuario-email" id="usuario-email" placeholder=" 📨 Correo" maxlength="40" required> <br>

                            <label for="usuario-rol"></label>
                                <select name="usuario-rol" id="usuario-rol" required>
                                    <option value="0" hidden>👤 Rol</option>
                                    <option value="1">🧑‍💻 Administrador</option>
                                    <option value="2">🧑‍💼 Empleado</option>
                                </select> <br>

                            <label for="usuario"></label> 
                                <input type="text" name="usuario" id="usuario" placeholder="👤  Usuario" required> <br>

                            <label for="contra"></label>
                                <input type="password" name="contra" id="contra" placeholder="🔒 Contraseña" required> <br>

                            <label for="usuario-contra"></label>
                                <input type="password" name="contra" id="contra" placeholder="🔒 Repetir Contraseña" required> <br>
                                
                        </div>

                        <br>

                        <!-- establecimiento-->
                        <div id="establecimiento">
                            <label id="datosEstablecimiento"><Strong>Datos de usuario</Strong></label> <br>

                            <label for="establecimiento-cuig"></label> 
                                <input type="number" name="establecimiento-cuig" id="establecimiento-cuig" placeholder="🧑‍🌾 Cuig" maxlength="40" required> 

                            <button type="button" id="boton-buscar">Buscar</button> <br>
                            
                            <label for="establecimiento-nombre"></label>
                                <select name="establecimiento-nombre" id="establecimiento-nombre" required>
                                    <option value="0" hidden>🐄 Nombre del establecimiento</option>
                                    <option value="1">Opcion1</option>
                                    <option value="2">Opcion2</option>
                                </select> <br>

                            <label for="establecimiento-provincia"></label>
                                <select name="establecimiento-provincia" id="establecimiento-provincia" required>
                                    <option value="0" hidden>🌎 Provincia</option>
                                    <option value="1">Opcion1</option>
                                    <option value="2">Opcion2</option>
                                </select> <br>
                            
                            <label for="establecimiento-departamento"></label>
                                <select name="establecimiento-departamento" id="establecimiento-departamento" required>
                                    <option value="0" hidden>🌎 Departamento</option>
                                    <option value="1">Opcion1</option>
                                    <option value="2">Opcion2</option>
                                </select> <br>

                            <label for="establecimiento-provincia"></label>
                                <select name="establecimiento-provincia" id="establecimiento-provincia" required>
                                    <option value="0" hidden>🌎 Localidad</option>
                                    <option value="1">Opcion1</option>
                                    <option value="2">Opcion2</option>
                                </select> <br>
                            
                            <label for="establecimiento-direccion"></label> 
                                <input type="text" name="establecimiento-direccion" id="establecimiento-direccion" placeholder="🏡 Direccion" maxlength="40" required> <br>

                            <label for="establecimiento-logo"> 🐄 Seleccione el logo del establecimiento </label> 
                                <input type="file" name="establecimiento-logo" id="establecimiento-logo" required> 

                        </div>
                        
                        <button type="submit" id="boton-aceptar">Aceptar</button>
                        <button type="reset" id="boton-aceptar">Cancelar</button>

                    </fieldset>
                </div>


            </form>
        </div>

        
    </main>

    <!-- Footer -->
    <footer>
        <div id="cosasdearriba">
            <div id="logo-titulo">
            <img id="imagenlogo" src="../static/img/GReenWebSinFondo.png" alt="Logo GreenWeb">
            <h2>GreenWeb</h2>
            </div>

            <div id="contenido">
            <p>Información del footer</p>
            </div>
        </div>

        <div id="cosasdeabajo">
                <p>Todos los derecho reservados &copy; 2025 GreenWeb - Proyecto IoT y Ciencia de Datos</p>
        </div>
    </footer>


    <!-- JS -->
    <!-- <script src="{% static 'js/validaciones.js' %}"></script> -->
</body>
</html>
