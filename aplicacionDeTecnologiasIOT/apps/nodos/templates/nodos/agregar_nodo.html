{% extends "base/base.html" %}
{% load static %}

{% block title %}Agregar Nodo - GreenWeb{% endblock %}

{% block extra_head %}
    <link rel="stylesheet" href="{% static 'css/crear_nodo.css' %}">
{% endblock %}

{% block content %}
    <section class="form-section">
        <h2>Agregar Nuevo Nodo Sensor</h2>
        
        <form method="post" class="nodo-form">
            {% csrf_token %}
            
            {{ form.as_p }}
            
            <div class="form-buttons">
                <button type="submit" class="btn-submit">Guardar Nodo</button>
                <a href="{% url 'nodos:lista_nodos' %}" class="btn-cancel">Cancelar</a>
            </div>
        </form>
    </section>
{% endblock %}
