{% comment %} 

{% extends "base.html" %}
{% block content %}
<h2>Crear Establecimiento</h2>

<form method="POST">
    {% csrf_token %}
    <label>Nombre del establecimiento:</label>
    <input type="text" name="nombre" required>

    <label>Provincia:</label>
    <input type="text" name="provincia" required>

    <label>Departamento:</label>
    <input type="text" name="departamento" required>

    <label>Localidad:</label>
    <input type="text" name="localidad" required>

    <label>Dirección:</label>
    <input type="text" name="direccion" required>

    <p>Tipo de establecimiento:</p>
    <label><input type="radio" name="tipo" value="senasa" checked> Reconocido por SENASA</label>
    <label><input type="radio" name="tipo" value="auxiliar"> Productor particular</label>

    <div id="campoCUIG">
        <label for="CUIG">CUIG (si es SENASA):</label>
        <input type="text" name="CUIG" id="CUIG">
    </div>

    <input type="submit" value="Crear">
</form>

<script>
    document.querySelectorAll('input[name="tipo"]').forEach(radio => {
        radio.addEventListener('change', e => {
            document.getElementById('campoCUIG').style.display = 
                e.target.value === 'senasa' ? 'block' : 'none';
        });
    });
</script>

{% endblock %} {% endcomment %}


{% extends "base.html" %}
{% block content %}
    <div class="container" style="max-width: 600px; margin: auto;">
        <h2>Registrar nuevo establecimiento</h2>
        <form method="POST" enctype="multipart/form-data">
            {% csrf_token %}

            <label>Nombre del establecimiento:</label>
            <input type="text" name="nombre" required>

            <label>Provincia:</label>
            <input type="text" name="provincia" required>

            <label>Departamento:</label>
            <input type="text" name="departamento" required>

            <label>Localidad:</label>
            <input type="text" name="localidad" required>

            <label>Dirección:</label>
            <input type="text" name="direccion" required>

            <p>Tipo de establecimiento:</p>
            <label><input type="radio" name="tipo" value="senasa" checked> Reconocido por SENASA</label>
            <label><input type="radio" name="tipo" value="auxiliar"> Productor particular</label>

            <div id="campoCUIG">
                <label for="CUIG">CUIG (solo para SENASA):</label>
                <input type="text" name="CUIG" id="CUIG">
            </div>

            <button type="submit">Crear establecimiento</button>
        </form>
    </div>

    <script>
        document.querySelectorAll('input[name="tipo"]').forEach(radio => {
            radio.addEventListener('change', e => {
                document.getElementById('campoCUIG').style.display =
                    e.target.value === 'senasa' ? 'block' : 'none';
            });
        });
    </script>
{% endblock %}
